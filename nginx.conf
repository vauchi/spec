server {
    listen 80 default_server;
    # kamal-proxy forwards with the original Host (vauchi.app), and
    # health checks arrive without that Host. Matching everything is
    # correct here: this container only ever receives traffic the proxy
    # has already routed to it.
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /build-info.json {
        expires -1;
        try_files $uri =404;
    }

    location = /indexnow-manifest.json {
        expires -1;
        try_files $uri =404;
    }

    # Relative mdBook assets require a trailing slash at the mount root.
    location = /spec {
        absolute_redirect off;
        return 301 /spec/$is_args$args;
    }

    # kamal-proxy routes vauchi.app/spec here without stripping the prefix.
    rewrite ^/spec/(.*)$ /$1 last;

    # Security headers (matching vauchi.app and vauchi.app/docs)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://cdn.vauchi.app; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Link '<https://vauchi.app/spec/llms.txt>; rel="describedby"' always;

    location ~* \.md$ {
        types { text/markdown md; }
        charset utf-8;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/html image/svg+xml;
    gzip_min_length 256;

    # mdBook pages: exact path, then /index.html fallback
    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }

    # Fonts and images are immutable
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # JS, CSS and the vectors JSON change with deployments
    location ~* \.(js|css|json)$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # Content-aware health check: a static 200 would pass with an empty web
    # root. Serving a real built file means an empty or unreadable root
    # answers 503, kamal-proxy refuses to promote the container, and the
    # last good one keeps serving (vauchi/docs, 2026-07-26 post-mortem).
    location = /health {
        try_files /build-info.json /index.html =503;
        access_log off;
    }

    error_page 404 /404.html;
}
