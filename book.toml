# mdbook 0.5.x has breaking changes; pinned to 0.4.x like vauchi/docs.

[book]
title = "Vauchi Protocol Specification"
description = "The Vauchi protocols as shipped: normative, versioned, with numbered claims and test vectors"
authors = ["Mattia Egloff"]
language = "en"
src = "src"

[build]
build-dir = "book"

[output.html]
# Served at vauchi.app/spec behind kamal-proxy's path prefix, like the
# docs at vauchi.app/docs (vauchi/private#875).
site-url = "/spec/"
default-theme = "coal"
preferred-dark-theme = "coal"
git-repository-url = "https://gitlab.com/vauchi/spec"
edit-url-template = "https://gitlab.com/vauchi/spec/-/edit/main/src/{path}"
no-section-label = false

[output.html.search]
enable = true
limit-results = 20
