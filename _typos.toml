[files]
extend-exclude = ["book/", "src/vectors/"]
[default.extend-words]
# mdBook's CSS variable spells --sidebar-non-existant this way.
existant = "existant"

[default.extend-identifiers]
openpgp4fpr = "openpgp4fpr"

[type.schema-license]
extend-glob = ["CC-BY-SA-3.0.txt"]
[type.schema-license.extend-words]
# Verbatim SPDX license text: https://spdx.org/licenses/CC-BY-SA-3.0.html
MERCHANTIBILITY = "MERCHANTIBILITY"

