# vauchi/spec: the protocol specification (ADR-076). Lint, REUSE, build,
# the vectors conformance check against Core's canonical file, and the
# image that vauchi/private deploys at vauchi.app/spec (vauchi/private#875),
# the same shape as vauchi/docs at vauchi.app/docs.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "schedule"

default:
  interruptible: true

include:
  - project: 'vauchi/scripts'
    ref: ci-templates-v2026.11.16
    file:
      - '/ci-templates/mr-rules.yml'
      - '/ci-templates/reuse.yml'
      - '/ci-templates/shipped-in.yml'
  - template: Security/Secret-Detection.gitlab-ci.yml

variables:
  GIT_DEPTH: "0"
  VAUCHI_SCRIPTS_REF: "issue/1267"

stages:
  - lint
  - build
  - package
  - deploy

# Deploy-pin contract: only push/web pipelines move :latest, package:docker
# records its digest and deploy:trigger forwards it (see the test header).
test:ci-contract:
  stage: lint
  tags: [docker]
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/alpine:3.21
  needs: []
  script:
    - sh ci/tests/deploy-pin-contract.test.sh
    - sh ci/tests/nightly-checks-contract.test.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - .gitlab-ci.yml
        - "ci/**/*"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

test:nginx-routing:
  stage: lint
  tags: [docker]
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/nginx:alpine
  needs: []
  before_script:
    - apk add --no-cache python3
  script:
    - python3 ci/tests/nginx-routing.test.py
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - nginx.conf
        - Dockerfile
        - .gitlab-ci.yml
        - "ci/**/*"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

lint:markdown:
  stage: lint
  tags:
    - self-hosted
    - markdownlint
  needs: []
  script:
    - markdownlint 'src/**/*.md' --config .markdownlint.json --ignore book
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Core stays canonical for the vectors until Core CI verifies against a
# pinned spec tag (ADR-076, decision 5); until then this fails when the
# copy here drifts from core main.
# The four drift checks also run on the nightly schedule, against whatever
# Core, the relays and e2e have on main that night, so a merge there that
# invalidates a copy or renames a cited function is found the next morning
# (vauchi/private#874). Every other job refuses the schedule: on it,
# $CI_COMMIT_BRANCH is the default branch too.
check:vectors:
  stage: lint
  tags: [docker]
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/alpine:3.21
  needs: []
  script:
    - wget -qO /tmp/core-vectors.json "https://gitlab.com/vauchi/core/-/raw/main/vauchi-core/tests/fixtures/test-vectors/vauchi-protocol-vectors-v1.json"
    - cmp /tmp/core-vectors.json src/vectors/vauchi-protocol-vectors-v1.json
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"

# Every test, lemma and invariant the claims chapter names must exist in
# Core or the end-to-end repository, or the claim backs nothing
# (vauchi/private#874). The self-test runs first so a broken check cannot
# pass silently (CC-27).
# The wire schema and its examples are Core's artefacts (ADR-076, decision
# 5): the copy here must equal Core's, and every example must validate
# against the schema, or the book describes a wire that does not exist.
# The self-test runs first so a broken validator cannot pass (CC-27).
check:wire-schema:
  stage: lint
  tags: [docker]
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/alpine:3.21
  needs: []
  before_script:
    - apk add --no-cache python3 py3-jsonschema > /dev/null
  script:
    - python3 ci/check-wire-schema.py --self-test
    - wget -qO /tmp/core-schema.json "https://gitlab.com/vauchi/core/-/raw/main/vauchi-protocol/schemas/relay-wire-v2.schema.json"
    - wget -qO /tmp/core-examples.json "https://gitlab.com/vauchi/core/-/raw/main/vauchi-protocol/schemas/relay-wire-v2-examples.json"
    - python3 ci/check-wire-schema.py src/schemas/relay-wire-v2.schema.json src/schemas/relay-wire-v2-examples.json --core-schema /tmp/core-schema.json --core-examples /tmp/core-examples.json
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"

check:claim-names:
  stage: lint
  tags: [docker]
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/alpine:3.21
  needs: []
  script:
    - sh ci/check-claim-names.sh --self-test
    - mkdir -p /tmp/roots
    - for r in core e2e relay ohttp-relay; do wget -qO "/tmp/$r.tar.gz" "https://gitlab.com/vauchi/$r/-/archive/main/$r-main.tar.gz" || exit 1; tar -xzf "/tmp/$r.tar.gz" -C /tmp/roots || exit 1; done
    # The claims chapter and every protocol chapter: the chapters name the
    # function behind each normative operation, in Core and the two relays.
    - for f in src/claims.md src/protocols/*.md; do sh ci/check-claim-names.sh "$f" /tmp/roots/core-main/vauchi-app /tmp/roots/core-main/vauchi-cabi /tmp/roots/core-main/vauchi-core /tmp/roots/core-main/vauchi-hardware /tmp/roots/core-main/vauchi-platform /tmp/roots/core-main/vauchi-protocol /tmp/roots/e2e-main /tmp/roots/relay-main /tmp/roots/ohttp-relay-main; done
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"

# The inverse link: tests, lemmas and invariants say which claim they back
# with `@claim: S<n>`, and this fails when an annotation names no claim or
# a shipped or partial claim has no annotation left in Core or e2e
# (vauchi/private#874). Nightly like the two checks above.
check:claim-annotations:
  stage: lint
  tags: [docker]
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/alpine:3.21
  needs: []
  script:
    - sh ci/check-claim-annotations.sh --self-test
    - mkdir -p /tmp/roots
    - for r in core e2e; do wget -qO "/tmp/$r.tar.gz" "https://gitlab.com/vauchi/$r/-/archive/main/$r-main.tar.gz" || exit 1; tar -xzf "/tmp/$r.tar.gz" -C /tmp/roots || exit 1; done
    - sh ci/check-claim-annotations.sh src/claims.md /tmp/roots/core-main/vauchi-core /tmp/roots/core-main/vauchi-app /tmp/roots/core-main/vauchi-protocol /tmp/roots/e2e-main
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"

secret_detection:
  allow_failure: false
  stage: lint
  tags: [docker]
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

build:spec:
  stage: build
  tags:
    - self-hosted
    - rust
  variables:
    MDBOOK_VERSION: "0.4.44"
  before_script:
    - export PATH="$HOME/.cargo/bin:$PATH"
  script:
    - |
      CURRENT=$(mdbook --version 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || echo "none")
      if [ "$CURRENT" != "$MDBOOK_VERSION" ]; then
        cargo install mdbook --version "$MDBOOK_VERSION" --locked
      fi
    # build-discovery.py is canonical in vauchi/scripts (private#1267):
    # fetch it at the pinned ref instead of committing a copy here.
    - |
      python3 - <<'FETCH'
      import os, urllib.request
      ref = os.environ["VAUCHI_SCRIPTS_REF"]
      url = f"{os.environ['CI_API_V4_URL']}/projects/77957857/repository/files/scripts%2Fbuild-discovery.py/raw?ref={ref}"
      request = urllib.request.Request(url, headers={"JOB-TOKEN": os.environ["CI_JOB_TOKEN"]})
      with urllib.request.urlopen(request, timeout=30) as response:
          body = response.read()
      if not body.strip():
          raise SystemExit("ERROR: build-discovery.py came back empty")
      open("scripts/build-discovery.py", "wb").write(body)
      FETCH
    - mdbook build
    - python3 scripts/build-discovery.py
    - python3 -m unittest discover -s scripts/tests -p 'test_*.py'
    - python3 scripts/validate_schema.py book > schema-validation.txt
    - cat schema-validation.txt
    # Build provenance: the deploy's smoke test and `just deploy-check` read
    # it, and nginx's /health serves it so an empty web root fails the
    # health check instead of deploying.
    - |
      cat > book/build-info.json <<EOF
      {"sha":"$CI_COMMIT_SHA","short_sha":"$CI_COMMIT_SHORT_SHA","ref":"$CI_COMMIT_REF_NAME","built":"$(date -u +%Y-%m-%dT%H:%M:%SZ)","pipeline":"$CI_PIPELINE_URL"}
      EOF
  artifacts:
    paths:
      - book/
      - schema-validation.txt
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# Build the nginx image (main branch only), daemonless via kaniko: the CI
# docker runners run a rootless dockerd, so docker:dind cannot start. Same
# pattern as vauchi/docs.
package:docker:
  stage: package
  tags: [docker]
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  variables:
    IMAGE: registry.gitlab.com/vauchi/spec
  needs:
    - build:spec
  before_script:
    # kaniko reads registry + dependency-proxy creds from this file. The
    # proxy auth routes the Dockerfile's `FROM ${HUB}/nginx:alpine` pull
    # through GitLab's dependency proxy (default HUB is `docker.io/library`
    # so local `docker build .` still works without args).
    - mkdir -p /kaniko/.docker
    - |
      cat > /kaniko/.docker/config.json <<JSON
      {"auths":{
        "${CI_REGISTRY}":{"auth":"$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')"},
        "${CI_DEPENDENCY_PROXY_SERVER}":{"auth":"$(printf '%s:%s' "$CI_DEPENDENCY_PROXY_USER" "$CI_DEPENDENCY_PROXY_PASSWORD" | base64 | tr -d '\n')"}
      }}
      JSON
  script:
    - |
      PUSH_ARGS="--destination $IMAGE:$CI_COMMIT_SHA"
      # Only a push (or a deliberate web run) advances :latest; an API
      # rebuild of the same commit changes nothing but base and timestamp.
      case "$CI_PIPELINE_SOURCE" in
        push|web) PUSH_ARGS="$PUSH_ARGS --destination $IMAGE:latest" ;;
      esac
      /kaniko/executor \
        --context "$CI_PROJECT_DIR" \
        --dockerfile "$CI_PROJECT_DIR/Dockerfile" \
        --build-arg HUB="${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}" \
        --digest-file "$CI_PROJECT_DIR/image.digest" \
        $PUSH_ARGS
    # deploy:trigger forwards this so production can refuse the :$SHA tag
    # once a later rebuild re-pushes it.
    - printf 'DEPLOY_IMAGE_DIGEST=%s\n' "$(cat "$CI_PROJECT_DIR/image.digest")" > deploy-image.env
  artifacts:
    reports:
      dotenv: deploy-image.env
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Auto-triggers the centralized deploy pipeline in vauchi/private, where
# kamal:deploy:spec-production is a manual gate: click "play" there.
deploy:trigger:
  stage: deploy
  needs:
    - job: package:docker
  trigger:
    project: vauchi/private
    branch: main
  variables:
    DEPLOY_SERVICE: spec
    DEPLOY_IMAGE: registry.gitlab.com/vauchi/spec:$CI_COMMIT_SHA
    DEPLOY_IMAGE_DIGEST: $DEPLOY_IMAGE_DIGEST
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    # A rebuild of an unchanged commit has nothing new to deploy.
    - if: $CI_PIPELINE_SOURCE == "pipeline" || $CI_PIPELINE_SOURCE == "trigger" || $CI_PIPELINE_SOURCE == "api"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# GitLab Pages keeps serving the built book until vauchi.app/spec has had
# its first deploy (vauchi/private#875); then this job goes.
pages:
  stage: deploy
  tags: [docker]
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/alpine:3.21
  needs:
    - job: build:spec
  script:
    - rm -rf public && mv book public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# The downstream audit builds this exact commit with the other public sites.
check:site-indexing:
  stage: lint
  needs: []
  inherit:
    variables: false
  trigger:
    project: vauchi/private
    branch: main
    strategy: mirror
    inputs:
      site_indexing: local
      indexing_project: $CI_PROJECT_PATH
      indexing_sha: $CI_COMMIT_SHA
    forward:
      yaml_variables: false
      pipeline_variables: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: &indexing-changes
        - ".gitlab-ci.yml"
        - "Dockerfile"
        - "nginx.conf"
        - "ci/**/*"
        - "scripts/**/*"
        - "src/**/*"
        - "theme/**/*"
        - "book.toml"
        - "package*.json"
        - "mdbook-*.mjs"
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes: *indexing-changes
